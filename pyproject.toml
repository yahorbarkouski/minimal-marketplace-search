[project]
name = "curated"
version = "0.1.0"
description = "Natural-language search over the products of curated.supply: scrape, index and search."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "bm25s>=0.3.11",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pystemmer>=3.1.0",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
    "typesafe-sdk>=0.7.2",
    "uvicorn[standard]>=0.54.0",
    "vercel>=0.12.2",
]

[project.scripts]
curated = "curated.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N", "C4", "PIE", "PT", "RET", "TID"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
# Typer commands take one parameter per command-line option.
"src/curated/cli.py" = ["PLR0917"]
# The job helper is kept as it is written elsewhere.
"src/curated/runlog.py" = ["ALL"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/curated/runlog.py"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
